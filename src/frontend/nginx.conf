# 백엔드와 같은 네임스페이스면 Service 이름 trader-ai 로 DNS 해석됩니다.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
